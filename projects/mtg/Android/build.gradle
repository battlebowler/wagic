buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

apply plugin: 'com.android.application'

def props = new Properties()
file("local.properties").withInputStream { props.load(it) }

// Single source of truth for the fork build number: MOD_VERSION in SDLActivity.java. The Android
// versionName/versionCode derive from it (and the same constant drives the GitHub update check), so
// bumping that one constant per release updates the installed version and the updater together.
def modVersion = 1
def _modVersionMatcher = (file('src/org/libsdl/app/SDLActivity.java').text =~ /MOD_VERSION\s*=\s*(\d+)/)
if (_modVersionMatcher) modVersion = _modVersionMatcher[0][1] as int

android {
    namespace 'net.wagic.app'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "net.wagic.app"
        // Personal fork identity: installs as net.wagic.app.battlebowler (distinct from stock Wagic,
        // so both can coexist). The code namespace stays net.wagic.app (JNI/R unaffected); only the
        // installed package id + its /Android/data/<pkg>/ storage change.
        applicationIdSuffix ".battlebowler"
        minSdk 21
        targetSdk 34
        // Derived from MOD_VERSION (see top of file). versionCode stays monotonic (base 240 + build);
        // versionName is the fork build shown in Android Settings, e.g. "battlebowler-4".
        versionCode 240 + modVersion
        versionName "battlebowler-${modVersion}"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'NDK_PROJECT_PATH=.'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDir 'libs'
        }
    }

    signingConfigs {
        release {
            storeFile file('assets/_keystore/wagic-release.keystore')
            storePassword props['WAGIC_STORE_PASSWORD']
            keyAlias    props['WAGIC_KEY_ALIAS']
            keyPassword props['WAGIC_KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        prefab false
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation('com.googlecode.json-simple:json-simple:1.1.1') {
        exclude group: 'junit', module: 'junit'
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}